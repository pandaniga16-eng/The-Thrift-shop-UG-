<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TASO - Jumia Style Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
.moving-bar{background:#f68b1e;color:white;padding:8px 0;overflow:hidden;white-space:nowrap;font-weight:bold;font-size:14px}
.moving-bar span{display:inline-block;animation:move 20s linear infinite}
@keyframes move{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
header{background:#000;color:white;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.logo{font-size:24px;font-weight:900;color:#f68b1e}
#search{padding:10px;width:250px;border-radius:4px;border:none;max-width:60vw}
.cart-btn{background:#f68b1e;color:white;border:none;padding:10px 18px;border-radius:4px;font-weight:bold;cursor:pointer}
.filters{display:flex;gap:8px;padding:12px;overflow-x:auto;background:white;position:sticky;top:0;z-index:5}
.filter-btn{padding:8px 18px;border:1px solid #ddd;border-radius:20px;background:white;cursor:pointer;white-space:nowrap}
.filter-btn.active{background:#f68b1e;color:white;border-color:#f68b1e}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;background:#f5f5f5}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);position:relative}
.badge{position:absolute;top:8px;left:8px;background:#fe3e3e;color:white;padding:3px 7px;font-size:12px;border-radius:4px;font-weight:bold}
.card img{width:100%;height:160px;object-fit:cover;background:#eee}
.info{padding:10px}
.name{font-size:14px;height:38px;overflow:hidden}
.price{color:#f68b1e;font-weight:900;margin:5px 0}
.old{color:#999;text-decoration:line-through;font-size:12px;margin-left:5px}
.add{width:100%;background:#f68b1e;color:white;border:none;padding:8px;border-radius:4px;font-weight:bold;cursor:pointer}
.add:hover{background:#e07a10}
#cartDrawer{position:fixed;right:-100%;top:0;width:90%;max-width:380px;height:100%;background:white;box-shadow:-5px 0 15px rgba(0,0,0,0.2);z-index:100;transition:0.3s;padding:15px;overflow-y:auto}
#cartDrawer.open{right:0}
</style>
</head>
<body>

<div class="moving-bar"><span>🔥 HOT DEALS TODAY - UP TO 50% OFF 🔥 FREE DELIVERY IN KAMPALA ON ORDERS ABOVE 100,000 UGX 🔥 WHATSAPP: +256 700 000000 🔥 NEW STOCK EVERYDAY - BAGS, SHOES, CAPS, CLOTHES 🔥</span></div>

<header>
<div class="logo">TASO STORE</div>
<input id="search" placeholder="Search bags, shoes, caps..." oninput="renderProducts()">
<button class="cart-btn" onclick="toggleCart()">Cart (<span id="cartCount">0</span>)</button>
</header>

<div class="filters" id="filters"></div>
<div class="grid" id="productGrid"></div>

<div id="cartDrawer">
<h3>Your Cart <span style="float:right;cursor:pointer" onclick="toggleCart()">X</span></h3>
<div id="cartItems" style="margin-top:15px"></div>
<div style="margin-top:15px;font-weight:bold">Total: <span id="cartTotal">UGX 0</span></div>
<button onclick="checkout()" style="width:100%;margin-top:15px;background:#25D366;color:white;border:none;padding:12px;border-radius:4px;font-weight:bold">Order on WhatsApp</button>
</div>

<script>
const whatsappNumber = "256700000000";
const products = [
{ id: 1, name: "Everyday Crossbody Bag", category: "Bags", price: 15000, oldPrice: 25000, discount: "-40%", image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80" },
{ id: 2, name: "Street Cap", category: "Accessories", price: 15000, oldPrice: 20000, discount: "-25%", image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=600&q=80" },
{ id: 3, name: "Everyday Sunglasses", category: "Accessories", price: 10000, oldPrice: 15000, discount: "-33%", image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=600&q=80" },
{ id: 4, name: "Casual Shoulder Bag", category: "Bags", price: 20000, oldPrice: 35000, discount: "-43%", image: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=600&q=80" },
{ id: 5, name: "Everyday Trainers", category: "Shoes", price: 55000, oldPrice: 80000, discount: "-31%", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" },
{ id: 6, name: "Patterned Shoulder Bag", category: "Bags", price: 25000, oldPrice: 40000, discount: "-37%", image: "IMG_2487.jpeg" },
{ id: 7, name: "Lacoste Cap", category: "Accessories", price: 6000, oldPrice: 10000, discount: "-40%", image: "IMG_0732.jpeg" },
{ id: 8, name: "Balenciaga Shoes", category: "Shoes", price: 50000, oldPrice: 75000, discount: "-33%", image: "IMG_0788.jpeg" },
{ id: 9, name: "Spider-Man Crocs", category: "Shoes", price: 90000, oldPrice: 120000, discount: "-25%", image: "IMG_1905.jpeg" },
{ id: 10, name: "Fashion Bag", category: "Bags", price: 30000, oldPrice: 50000, discount: "-40%", image: "IMG_2543.jpeg" },
{ id: 11, name: "Air force Shoes", category: "Shoes", price: 45000, oldPrice: 65000, discount: "-30%", image: "IMG_2545.jpeg" },
{ id: 12, name: "Air jordan Shoes", category: "Shoes", price: 45000, oldPrice: 70000, discount: "-35%", image: "IMG_2546.jpeg" },
{ id: 13, name: "chrome Arts Jumper", category: "Clothes", price: 30000, oldPrice: 45000, discount: "-33%", image: "IMG_2547.jpeg" },
{ id: 14, name: "chrome Arts Jumper", category: "Clothes", price: 30000, oldPrice: 45000, discount: "-33%", image: "IMG_2548.jpeg" }
];
let activeCategory="All";
const cart={};
const money = amount => "UGX " + amount.toLocaleString("en-UG");
const categories=["All",...new Set(products.map(p=>p.category))];
function renderFilters(){
const c=document.getElementById("filters");
c.innerHTML=categories.map(cat=>`<button class="filter-btn ${cat===activeCategory?'active':''}" onclick="setCategory('${cat}')">${cat}</button>`).join("");
}
function setCategory(cat){activeCategory=cat;renderFilters();renderProducts();}
function renderProducts(){
const search=document.getElementById("search").value.trim().toLowerCase();
const grid=document.getElementById("productGrid");
const filtered=products.filter(p=>{
const matchCat=activeCategory==="All"||p.category===activeCategory;
const matchSearch=!search||p.name.toLowerCase().includes(search);
return matchCat&&matchSearch;
});
grid.innerHTML=filtered.map(p=>`
<div class="card">
<div class="badge">${p.discount}</div>
<img src="${p.image}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
<div class="info">
<div class="name">${p.name}</div>
<div><span class="price">${money(p.price)}</span><span class="old">${money(p.oldPrice)}</span></div>
<button class="add" onclick="addToCart(${p.id})">Add to Cart</button>
</div>
</div>
`).join("");
}
function addToCart(id){cart[id]=(cart[id]||0)+1;updateCart();}
function updateCart(){
let count=0,total=0,html="";
for(const id in cart){
const p=products.find(x=>x.id==id);
count+=cart[id];
total+=p.price*cart[id];
html+=`<div style="display:flex;justify-content:space-between;margin:8px 0"><span>${p.name} x${cart[id]}</span><span>${money(p.price*cart[id])}</span></div>`;
}
document.getElementById("cartCount").innerText=count;
document.getElementById("cartTotal").innerText=money(total);
document.getElementById("cartItems").innerHTML=html||"Cart is empty";
}
function toggleCart(){document.getElementById("cartDrawer").classList.toggle("open");}
function checkout(){
let msg="Hello TASO STORE, I want to order:%0A";
for(const id in cart){
const p=products.find(x=>x.id==id);
msg+=`-${p.name} x${cart[id]} = ${money(p.price*cart[id])}%0A`;
}
msg+=`Total: ${document.getElementById("cartTotal").innerText}`;
window.open(`https://wa.me/${whatsappNumber}?text=${msg}`,"_blank");
}
renderFilters();renderProducts();
</script>
</body>
</html>
